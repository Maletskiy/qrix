<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#030304" />
    <title>Qrix — красивые QR-коды</title>
    <meta
      name="description"
      content="Qrix — генератор красивых QR-кодов для криптовалюты, ссылок, текста и Wi-Fi. Стили, градиенты, логотип, экспорт в PNG и SVG."
    />
    <link rel="icon" type="image/svg+xml" href="/qrix-logo.svg" />

    <!-- главный адрес: остальные (www, vercel-домен) считаются копиями -->
    <link rel="canonical" href="https://qr-ix.com/" />

    <!-- превью ссылки в мессенджерах, соцсетях и Slack/Discord -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Qrix" />
    <meta property="og:url" content="https://qr-ix.com/" />
    <meta property="og:locale" content="ru_RU" />
    <meta property="og:title" content="Qrix — нет квадрата, есть код" />
    <meta
      property="og:description"
      content="Генератор красивых QR-кодов для криптовалюты, ссылок, текста и Wi-Fi. Стили, градиенты, логотип, экспорт в PNG и SVG."
    />
    <meta property="og:image" content="https://qr-ix.com/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Qrix — генератор красивых QR-кодов"
    />

    <!-- X/Twitter читает свою разметку, но тоже понимает og: -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Qrix — нет квадрата, есть код" />
    <meta
      name="twitter:description"
      content="Генератор красивых QR-кодов для криптовалюты, ссылок, текста и Wi-Fi."
    />
    <meta name="twitter:image" content="https://qr-ix.com/og.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
