name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check and build
        run: npm run build

      # Renders real QR codes in every style, rasterises them and decodes the
      # result. Catches the "looks fine, scans badly" class of bug.
      - name: Verify QR readability
        run: npm run verify
